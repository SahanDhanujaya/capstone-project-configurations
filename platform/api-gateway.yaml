spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: tool-inventory-service
              uri: lb://TOOL-INVENTORY-SERVICE
              predicates:
                - Path=/api/v1/tools/**

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/v1/users/**

          default-filters:
            - PreserveHostHeader

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowed-methods: "*"
                allowed-headers: "*"
server:
  port: 8000